[env:lolin32_lite]
; Pinned: the PS3 library relies on Bluedroid internals of Arduino core 2.0.x
; and does not compile against core 3.x.
platform = platformio/espressif32@6.12.0
board = lolin32_lite
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/jvpernis/esp32-ps3.git#416b7b561500670bcdc72c8f0c1a01436eab8bdf
